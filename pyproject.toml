[project]
name = "mlops-data-vostrikova"
version = "0.1.0"
description = "MLOps data versioning practice with DVC and ClearML"
authors = [
    {name = "Alina"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc==3.63.0",
    "clearml==2.0.2",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "pathspec (==0.12.1)",
    "mlflow (>=3.0,<4)",
    "joblib (>=1.4,<2)",
    "matplotlib (>=3.9,<4)",
    "ipykernel (>=6.29,<8)",
    "nbclient (>=0.10,<1)",
    "nbformat (>=5.10,<6)"
]

[tool.poetry]
package-mode = false
